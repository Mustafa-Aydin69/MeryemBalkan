# SonarCloud proje kimliği — sonarcloud.io'da oluştururken atanan key
sonar.projectKey=Mustafa-Aydin69_MeryemBalkan
sonar.organization=mustafa-aydin69

sonar.projectName=Meryem Balkan
sonar.projectVersion=1.0

# Analiz edilecek kaynak dizin
sonar.sources=app
sonar.exclusions=\
  **/.next/**,\
  **/node_modules/**,\
  **/coverage/**,\
  **/__tests__/**,\
  **/*.test.ts,\
  **/*.test.tsx,\
  **/public/**

# Test dizini
sonar.tests=__tests__
sonar.test.inclusions=**/__tests__/**/*.ts

# Coverage raporu (vitest --coverage çıktısı)
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# TypeScript ayarları
sonar.typescript.tsconfigPath=tsconfig.json
sonar.sourceEncoding=UTF-8
